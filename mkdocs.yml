site_name: TrackSplit
site_url: https://rouzax.github.io/TrackSplit/docs/
repo_url: https://github.com/Rouzax/TrackSplit
repo_name: Rouzax/TrackSplit
edit_uri: edit/main/docs/

# Build into a dedicated, gitignored directory. The tracked `site/` holds the
# hand-curated landing page; the docs build must not overwrite it. This must
# stay in step with what deploy-docs.yml publishes: Zensical has no
# `-d` / `--site-dir` flag, so this key is the only thing that decides where
# the build lands.
site_dir: build/docs

# Built with Zensical, which reads this mkdocs.yml natively. Material for
# MkDocs went into maintenance mode in November 2025; Zensical is the same
# team's successor. Keeping the config in mkdocs.yml rather than the native
# zensical.toml is deliberate: it is what the Zensical project itself does,
# and it keeps the build tool swappable.

theme:
  name: material
  favicon: assets/favicon.png
  logo: assets/icon.png
  palette:
    scheme: slate
    primary: custom
    accent: teal
  # Zensical's recommended set (as generated by `zensical new`), plus
  # navigation.tabs to keep this site's existing top-level layout.
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    # navigation.path (breadcrumbs) and navigation.indexes (section index
    # pages) are omitted on purpose: this nav is flat, so both were verified
    # to render nothing. Add them if the nav ever gains nested sections.
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tracking
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.action.edit
    - content.tabs.link
    - content.tooltips
    - content.footnote.tooltips
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

# Renders a small icon row in the footer of every page. Icon names resolve
# against the sets mkdocs-material bundles under templates/.icons; the
# fontawesome brand set has no Ko-fi glyph, so use the simple-icons one.
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Rouzax/TrackSplit
      name: TrackSplit on GitHub
    - icon: simple/kofi
      link: https://ko-fi.com/O0W221GBUG
      name: Support TrackSplit on Ko-fi

# Only honoured by MkDocs; Zensical ignores exclude_docs. The real guard is
# .gitignore, which keeps docs/plans/ out of the repo and therefore out of CI.
exclude_docs: |
  plans/

# Zensical's recommended set, as generated by `zensical new`. Declaring this
# key at all suppresses those defaults, so the list is kept complete rather
# than trimmed to what today's pages happen to use.
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: Rouzax
      repo: TrackSplit
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Usage: usage.md
  - Configuration: configuration.md
  - Output Structure: output.md
  - Troubleshooting: troubleshooting.md
  - FAQ: faq.md
