site_name: TrackSplit
site_url: https://rouzax.github.io/TrackSplit/docs/
repo_url: https://github.com/Rouzax/TrackSplit
repo_name: Rouzax/TrackSplit

# Build into a dedicated, gitignored directory. The tracked `site/` holds the
# hand-curated landing page; mkdocs must not overwrite it.
site_dir: site_build

theme:
  name: material
  favicon: assets/favicon.png
  logo: assets/icon.png
  palette:
    scheme: slate
    primary: custom
    accent: teal
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

# Renders a small icon row in the footer of every page. Icon names resolve
# against the sets mkdocs-material bundles under templates/.icons; the
# fontawesome brand set has no Ko-fi glyph, so use the simple-icons one.
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Rouzax/TrackSplit
      name: TrackSplit on GitHub
    - icon: simple/kofi
      link: https://ko-fi.com/O0W221GBUG
      name: Support TrackSplit on Ko-fi

exclude_docs: |
  plans/

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Usage: usage.md
  - Configuration: configuration.md
  - Output Structure: output.md
  - Troubleshooting: troubleshooting.md
  - FAQ: faq.md
