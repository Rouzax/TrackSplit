name: Bug Report
description: Report a bug or unexpected behavior
type: Bug
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If a tag value is already wrong in the source MKV (artist, festival, stage, chapter titles), the problem is in CrateDigger: use the [CrateDigger issue tracker](https://github.com/Rouzax/CrateDigger/issues) instead.

  - type: input
    id: version
    attributes:
      label: TrackSplit version
      description: Output of `tracksplit --version`
      placeholder: e.g. 0.18.1
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command
      description: The full command you ran
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What you expected to happen
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: What actually happened
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, ffmpeg version
      placeholder: |
        Python version:
        OS:
        ffmpeg version:
    validations:
      required: false

  - type: textarea
    id: check-output
    attributes:
      label: tracksplit --check output
      description: Output of running `tracksplit --check`
      render: text
    validations:
      required: false

  - type: textarea
    id: debug-log
    attributes:
      label: Log file
      description: >
        Each run writes a debug log automatically. The path is shown in the
        summary panel at the end of a run and in `tracksplit --check` under
        Log directory. Paste the contents of that file here.
      render: text
    validations:
      required: false
